plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.j2kt'
version = '0.2.0'

dependencies {
    compileOnly files('libs/pumpkin-stub.jar')
}

sourceSets {
    main {
        java.srcDir 'src/generated/java'
    }
    tools {
        java.srcDir 'tools/src/main/java'
    }
}

tasks.register('generateReexports', JavaExec) {
    group = 'build'
    description = 'Generates the Abs re-export facade from the Pumpkin stub source tree.'
    dependsOn tasks.named('toolsClasses')
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'dev.j2kt.pumpkin.abs.generator.ReexportGenerator'
    args '--stub-source', providers.gradleProperty('stubSource').getOrElse('../pumpkin-stub/src/main/java'),
            '--output', 'src/generated/java'
}

tasks.register('toolsJar', Jar) {
    archiveBaseName = 'pumpkin-abs-tools'
    from sourceSets.tools.output
    manifest {
        attributes 'Main-Class': 'dev.j2kt.pumpkin.abs.generator.ListenerGenerator'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'pumpkin-abs'
        }
    }
}
