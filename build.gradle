plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.j2kt'
version = '0.1.1'

dependencies {
    compileOnly files('libs/pumpkin-stub.jar')
}

sourceSets {
    tools {
        java.srcDir 'tools/src/main/java'
    }
}

tasks.register('toolsJar', Jar) {
    archiveBaseName = 'pumpkin-abs-tools'
    from sourceSets.tools.output
    manifest {
        attributes 'Main-Class': 'dev.j2kt.pumpkin.abs.generator.ListenerGenerator'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'pumpkin-abs'
        }
    }
}
