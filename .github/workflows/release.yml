name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build toolsJar --console=plain

      - name: Prepare artifacts
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle | head -n 1)"

          test -n "$project_version"

          if [ "$version" != "$project_version" ]; then
            printf 'Tag version %s does not match project version %s\n' "$version" "$project_version" >&2
            exit 1
          fi

          mkdir -p dist
          cp "build/libs/pumpkin-abs-${version}.jar" "dist/pumpkin-abs-${version}.jar"
          cp "build/libs/pumpkin-abs-${version}-sources.jar" "dist/pumpkin-abs-${version}-sources.jar"
          cp "build/libs/pumpkin-abs-tools-${version}.jar" "dist/pumpkin-abs-tools-${version}.jar"
          (cd dist && sha256sum "pumpkin-abs-${version}.jar" > "pumpkin-abs-${version}.jar.sha256")
          (cd dist && sha256sum "pumpkin-abs-${version}-sources.jar" > "pumpkin-abs-${version}-sources.jar.sha256")
          (cd dist && sha256sum "pumpkin-abs-tools-${version}.jar" > "pumpkin-abs-tools-${version}.jar.sha256")

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pumpkin-abs-release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pumpkin-abs-release
          path: dist

      - name: Create release notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## Pumpkin Abs ${VERSION}

          Bukkit-style abstraction for Pumpkin plugins.

          - Java: 21
          - Pumpkin Stub: 0.1.1
          - J2KT Pumpkin: 0.1.3
          - Pumpkin API: 0.1.2
          - WIT: pumpkin:plugin@0.1.0

          The tools JAR generates command and listener registration from configured source files or folders and produces a generated plugin class.
          EOF

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/pumpkin-abs-${VERSION}.jar" \
            "dist/pumpkin-abs-${VERSION}-sources.jar" \
            "dist/pumpkin-abs-tools-${VERSION}.jar" \
            "dist/pumpkin-abs-${VERSION}.jar.sha256" \
            "dist/pumpkin-abs-${VERSION}-sources.jar.sha256" \
            "dist/pumpkin-abs-tools-${VERSION}.jar.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pumpkin Abs ${VERSION} (Java 21)" \
            --notes-file release-notes.md
